<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY PORTFOLIO</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1>포트폴리오</h1>
  <span class="status" id="status"></span>
  <button class="iconbtn" id="hiddenBtn" type="button" hidden><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="4.5" rx="1"/><path d="M5 8.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8.5"/><path d="M10 13h4"/></svg></button>
  <button class="btn" id="make">업데이트</button>
  <button class="btn primary" id="download">다운로드</button>
</header>
<main class="stage" id="stage"></main>

<dialog id="confirm">
  <form method="dialog">
    <h2>새로 생긴 저장소</h2>
    <p class="hint">체크한 것은 포트폴리오에 넣고, 체크하지 않은 것은 뺍니다. 뺀 저장소는 다시 묻지 않습니다.</p>
    <ul id="newList"></ul>
    <div class="foot"><button class="btn primary" value="ok">확인</button></div>
  </form>
</dialog>

<dialog id="hid">
  <form method="dialog">
    <h2>뺀 저장소</h2>
    <p class="hint">미완성이어서 뺀 저장소를 다시 확인 목록으로 되돌립니다.</p>
    <ul id="hidList"></ul>
    <div class="foot"><button class="btn" value="cancel">취소</button><button class="btn primary" value="ok" id="hidOk">다시 확인하기</button></div>
  </form>
</dialog>

<dialog id="dl">
  <form method="dialog" id="dlForm">
    <h2>다운로드할 프로젝트</h2>
    <p class="hint">1인 개발은 프론트·백엔드 모두에 포함됩니다.</p>
    <div class="presets" id="dlPresets"></div>
    <ul id="dlList"></ul>
    <div class="foot"><span class="all"><button type="button" class="link" data-all="1">전체 선택</button><button type="button" class="link" data-all="0">전체 해제</button></span><button class="btn" value="cancel">취소</button><button class="btn primary" value="ok" id="dlOk">PDF 만들기</button></div>
  </form>
</dialog>

<dialog id="edit">
  <form method="dialog" id="editForm">
    <h2 id="editTitle"></h2>
    <div class="fields" id="editFields"></div>
    <div class="foot"><button class="btn" value="cancel">취소</button><button class="btn primary" value="save">저장</button></div>
  </form>
</dialog>
<script src="/render.js"></script>
<script src="/main.js"></script>
</body>
</html>
