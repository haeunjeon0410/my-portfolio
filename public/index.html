<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY PORTFOLIO</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <h1>포트폴리오</h1>
  <span class="status" id="status"></span>
  <button class="btn" id="make">업데이트</button>
  <button class="btn primary" id="download">다운로드</button>
</header>
<main class="stage" id="stage"></main>

<dialog id="confirm">
  <form method="dialog">
    <h2>새로 생긴 저장소</h2>
    <p class="hint">체크한 것은 포트폴리오에 넣고, 체크하지 않은 것은 뺍니다. 뺀 저장소는 다시 묻지 않습니다.</p>
    <ul id="newList"></ul>
    <div class="foot"><button class="btn primary" value="ok">확인</button></div>
  </form>
</dialog>

<dialog id="edit">
  <form method="dialog" id="editForm">
    <h2 id="editTitle"></h2>
    <div class="fields" id="editFields"></div>
    <div class="foot"><button class="btn" value="cancel">취소</button><button class="btn primary" value="save">저장</button></div>
  </form>
</dialog>
<script src="/render.js"></script>
<script src="/main.js"></script>
</body>
</html>
